services:
  frontend:
    build:
      context: ./fe
      dockerfile: Dockerfile
    ports: 
      - "5173:5173"
    env_file:
      - ./fe/.env
    depends_on:
      - backend 
    networks:
      - app_network

  backend:
    build:
      context: ./be
      dockerfile: Dockerfile    
    ports:
      - "3000:3000"
    env_file:
      - ./be/.env
    networks:
      - app_network
  
networks:
  app_network:
    driver: bridge