stages:
  - install
  - test
  - build
  - docker-build-frontend
  - docker-build-backend
  - prisma
  - push-fe
  - push-be
  - deploy

image: node:22-slim

before_script:
  - corepack enable
  - corepack prepare pnpm@latest --activate
  - pnpm config set store-dir .pnpm-store

cache:
  key:
    files:
      - pnpm-lock.yaml
  paths:
    - .pnpm-store
    - node_modules/

install:
  stage: install
  script:
    - pnpm install -w --frozen-lockfile --reporter=append-only

test:
  stage: test
  script:
    - pnpm test

build:
  stage: build
  script:
    - pnpm build

docker-build-frontend:
  image: docker:latest
  stage: docker-build-frontend
  services:
    - docker:dind
  script:
    - docker build -t asset-management-frontend:latest -f Dockerfile.frontend .

docker-build-backend:
  image: docker:latest
  stage: docker-build-backend
  services:
    - docker:dind
  script:
    - docker build -t asset-management-backend:latest -f Dockerfile.backend .

prisma:
  stage: prisma
  script:
    - pnpm --filter be prisma:migrate

push-fe:
  image: docker:latest
  stage: push-fe
  services:
    - docker:dind
  script:
    - echo "Pushing frontend Docker image to registry..."
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker tag asset-management-frontend:latest $CI_REGISTRY_IMAGE/frontend:latest
    - docker push $CI_REGISTRY_IMAGE/frontend:latest
  only:
    - main

push-be:
  image: docker:latest
  stage: push-be
  services:
    - docker:dind
  script:
    - echo "Pushing backend Docker image to registry..."
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker tag asset-management-backend:latest $CI_REGISTRY_IMAGE/backend:latest
    - docker push $CI_REGISTRY_IMAGE/backend:latest
  only:
    - main

deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
  script:
    - ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP "CI_REGISTRY=$CI_REGISTRY CI_REGISTRY_IMAGE=$CI_REGISTRY_IMAGE CI_REGISTRY_USER=$CI_REGISTRY_USER CI_REGISTRY_PASSWORD=$CI_REGISTRY_PASSWORD bash ~/deploy.sh"
  only:
    - main
