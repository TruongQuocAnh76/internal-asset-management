services:
  frontend:
    build:
      context: ./fe
      dockerfile: Dockerfile
      target: dev
    ports: 
      - "5173:5173"
    env_file:
      - ./fe/.env
    depends_on:
      - backend 
    volumes:
      - ./fe:/app
    networks:
      - app_network

  backend:
    build:
      context: ./be
      dockerfile: Dockerfile    
      target: dev
    ports:
      - "3000:3000"
    env_file:
      - ./be/.env
    volumes:
      - ./be:/app
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=supa_secret_redis_password
    networks:
      - app_network

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    networks:
      - app_network

  db:
    image: postgres:latest
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=asset_management
    volumes:
      - db_data:/var/lib/postgresql
    networks:
      - app_network
    
  minio:
    image: minio/minio:latest
    ports:
      - "9001:9001"
    expose:
      - "9000"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - app_network

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"  # SMTP server
      - "8025:8025"  # Web UI
    networks:
      - app_network

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "9000:9000"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - frontend
      - backend
      - minio
    networks:
      - app_network

volumes:
  minio_data:
  db_data:
  redis_data:
  
networks:
  app_network:
    driver: bridge